common-bun-init-steps: &common-bun-init-steps
  - name: Checkout
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/checkout/main.yaml'
  # The images ship Node 20, but Angular 22 and jsdom 30 require Node ^22.22 || ^24.15
  - name: Install Node
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/install-node/main.yaml'
    inputs:
      node_version: '24'
  - name: Restore Node Modules Cache
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/cache/main.yaml'
    inputs:
      key: 'bun.lock|patches/**'
      paths: 'node_modules'
      base-branch: 'main'
  - name: Restore Browser Binary Cache
    uses: 'nrwl/nx-cloud-workflows/v5/workflow-steps/cache/main.yaml'
    inputs:
      key: 'bun.lock|"browsers"'
      paths: |
        '../.cache/ms-playwright'
      base-branch: 'main'
  - name: Install Bun
    script: |
      # Install bun via npm (since Node is already available in the image)
      npm install -g bun
  - name: Install Node Modules
    script: bun install --frozen-lockfile
  # The generic install-browsers step only reacts to @playwright/test; Vitest browser mode
  # (material-right-sheet) uses the plain playwright package and needs Chromium.
  - name: Install Playwright Chromium
    script: bunx playwright install --with-deps chromium

launch-templates:
  linux-small-bun:
    resource-class: 'docker_linux_amd64/small'
    image: 'ubuntu22.04-node20.19-v2'
    init-steps: *common-bun-init-steps
  linux-medium-bun:
    resource-class: 'docker_linux_amd64/medium'
    image: 'ubuntu22.04-node20.19-v2'
    init-steps: *common-bun-init-steps
  linux-medium-plus-bun:
    resource-class: 'docker_linux_amd64/medium+'
    image: 'ubuntu22.04-node20.19-v2'
    init-steps: *common-bun-init-steps
  linux-large-bun:
    resource-class: 'docker_linux_amd64/large'
    image: 'ubuntu22.04-node20.19-v2'
    init-steps: *common-bun-init-steps
